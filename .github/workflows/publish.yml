name: Release and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version or bump keyword (e.g. 1.0.6, patch, minor, major)"
        required: false
        default: "patch"

permissions:
  id-token: write # Trusted Publishing (OIDC) for PyPI
  contents: write # Update documentation, create tag, and GitHub Release

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'feat(release):')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Determine release version
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            MSG="feat(release): $INPUT_VERSION"
          else
            MSG="$COMMIT_MSG"
          fi
          NEW_VERSION=$(python scripts/release.py resolve-version --message "$MSG")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Target release version: $NEW_VERSION"

      - name: Build minified assets
        run: make minify

      - name: Update documentation versioned links
        run: |
          python scripts/release.py update-docs --version "${{ steps.versioning.outputs.version }}"

      - name: Commit release assets and push tag
        run: |
          TAG="${{ steps.versioning.outputs.version }}"
          git checkout -B master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage documentation updates and minified assets
          git add README.md documentation/content/index.md
          git add -f dist/zensical-slides.min.mjs dist/zensical-slides.min.css

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): $TAG [skip ci]"
          fi

          git tag -f "$TAG"
          git push origin master "$TAG" --force

      - name: Build Python packages
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-pypi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG="${{ steps.versioning.outputs.version }}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            MSG="feat(release): $INPUT_VERSION"
          else
            MSG="$COMMIT_MSG"
          fi

          python scripts/release.py extract-notes --message "$MSG" > release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/zensical-slides.min.mjs \
              dist/zensical-slides.min.css \
              dist-pypi/*.tar.gz \
              dist-pypi/*.whl \
              --clobber
          elif [ -s release_notes.md ]; then
            gh release create "$TAG" \
              dist/zensical-slides.min.mjs \
              dist/zensical-slides.min.css \
              dist-pypi/*.tar.gz \
              dist-pypi/*.whl \
              --title "$TAG" \
              --notes-file release_notes.md
          else
            gh release create "$TAG" \
              dist/zensical-slides.min.mjs \
              dist/zensical-slides.min.css \
              dist-pypi/*.tar.gz \
              dist-pypi/*.whl \
              --title "$TAG" \
              --generate-notes
          fi
