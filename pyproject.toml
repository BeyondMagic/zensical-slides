[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "zensical-slides"
description = "A Zensical plugin to add a focus-slide button for sections."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "zensical"]

[project.scripts]
zensical-slides = "zensical_slides.plugin:main"

[project.entry-points."zensical.plugins"]
slides = "zensical_slides.plugin:SlidesPlugin"

[project.entry-points."markdown.extensions"]
zensical_slides = "zensical_slides.extension:ZensicalSlidesExtension"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/zensical_slides",
  "tests",
  "README.md",
  "LICENSE",
  "COPYING",
  "COPYING.LESSER",
]
