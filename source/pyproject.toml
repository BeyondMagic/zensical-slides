[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "zensical-slides"
description = "A Zensical plugin to add a focus-slide button for sections."
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "zensical"]

[project.scripts]
zensical-slides = "zensical_slides.plugin:main"

[project.entry-points."zensical.plugins"]
slides = "zensical_slides.plugin:SlidesPlugin"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "zensical_slides/__init__.py"
"plugin.py" = "zensical_slides/plugin.py"
"javascript" = "zensical_slides/javascript"
"stylesheet" = "zensical_slides/stylesheet"
