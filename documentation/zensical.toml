[project]
site_url = "https://beyondmagic.github.io/template/"
site_name = "template"
site_description = "A template for software projects with documentation of all kinds of decision-records."
site_author = "João V. Farias"
docs_dir = "content"

copyright = "BeyondMagic © 2026"

repo_url = "https://github.com/BeyondMagic/template"
repo_name = "BeyondMagic/template"
edit_uri = "edit/main/documentation/"

extra_css = [
	"stylesheet/typography.css"
]
extra_javascript = []

nav = [
  { "General" = "index.md" },
]

[project.extra]
generator = false

[project.theme]
# logo = "assets/logo.svg"
# favicon = "assets/logo.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# [[project.theme.palette]]
# media = "(prefers-color-scheme)"
# toggle.icon = "lucide/sun-moon"
# toggle.name = "Follow system preference"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
# toggle.icon = "lucide/sun"
# toggle.name = "Switch to dark mode"
primary = "pink"
accent = "pink"

# [[project.theme.palette]]
# media = "(prefers-color-scheme: dark)"
# scheme = "slate"
# toggle.icon = "lucide/moon"
# toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
